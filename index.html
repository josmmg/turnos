<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turnos</title>
<meta name="theme-color" content="#F2F4F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Turnos">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#18202B; --ink-2:#4A5565; --ink-3:#8590A0; --line:#E2E6EC; --wa:#128C4A;
  --m:#1A9FB4; --t:#2F9E44; --n:#6B3FC0; --d:#E39B1B; --v:#3B82D9; --comp:#D9B310; --il:#D9667A; --fibao:#B5462B; --fest:#C2255C; --today:#E3E7ED; --trip:#FCE4EE; --trip-b:#F3A9C6;
  --radius-lg:22px; --radius:14px; --radius-sm:9px;
  --display:'Bricolage Grotesque', system-ui, sans-serif; --body:'Atkinson Hyperlegible', system-ui, sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0F141B; --surface:#18202B; --ink:#EEF1F5; --ink-2:#B4BCC8; --ink-3:#7C8696; --line:#273140; --wa:#4FD18A;
    --m:#3CC0D4; --t:#4CC266; --n:#9C7BEA; --d:#F0B33E; --v:#5C9EEB; --comp:#E8C83A; --il:#E8899A; --fibao:#D46A4C; --fest:#F06595; --today:#2A3442; --trip:#45243A; --trip-b:#9B4A78; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#0F141B; --surface:#18202B; --ink:#EEF1F5; --ink-2:#B4BCC8; --ink-3:#7C8696; --line:#273140; --wa:#4FD18A;
    --m:#3CC0D4; --t:#4CC266; --n:#9C7BEA; --d:#F0B33E; --v:#5C9EEB; --comp:#E8C83A; --il:#E8899A; --fibao:#D46A4C; --fest:#F06595; --today:#2A3442; --trip:#45243A; --trip-b:#9B4A78; color-scheme:dark; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--v);outline-offset:2px;border-radius:8px}
.app{max-width:520px;margin:0 auto;min-height:100dvh;padding-block:calc(var(--safe-t) + 8px) calc(var(--safe-b) + 96px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
h2{font-size:1.5rem;font-weight:800}
h3{font-size:1.06rem;font-weight:700}
.muted{color:var(--ink-3)}
.screen{display:none}
.screen.on{display:block;animation:in .22s ease-out}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){ .screen.on{animation:none} *{transition:none!important} }

/* barra superior */
.top{display:flex;align-items:center;justify-content:space-between;min-height:48px;margin-bottom:10px}
.top .greet{font-family:var(--display);font-weight:700;font-size:1.05rem;color:var(--ink-2)}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:active{background:var(--line)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--ink-3)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--t)}
.sync.pend i{background:var(--d)} .sync.off i{background:var(--ink-3)} .sync.err i{background:var(--fest)}

/* cielo del turno (lo memorable) */
.sky{position:relative;border-radius:var(--radius-lg);overflow:hidden;color:#fff;padding:22px 22px 20px;min-height:268px;display:flex;flex-direction:column;justify-content:space-between;isolation:isolate;box-shadow:0 18px 40px -22px rgba(20,30,60,.55)}
.sky::before{content:"";position:absolute;inset:0;z-index:-2;background:var(--sky)}
.sky .orb{position:absolute;z-index:-1;border-radius:50%;width:150px;height:150px;right:-26px;top:-30px;background:var(--orb);filter:blur(.3px);box-shadow:0 0 70px 20px var(--glow)}
.sky .stars{position:absolute;inset:0;z-index:-1;opacity:var(--stars,0);background-image:radial-gradient(1.4px 1.4px at 20% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 70% 60%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 40% 75%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 85% 25%,#fff 50%,transparent 51%),radial-gradient(1.3px 1.3px at 10% 65%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 55% 15%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 30% 50%,#fff 50%,transparent 51%)}
.sky .date{font-size:.98rem;opacity:.92}
.sky .shift{font-family:var(--display);font-weight:800;font-size:3.4rem;line-height:.95;letter-spacing:-.03em;margin:6px 0 4px}
.sky .hours{font-size:1.15rem;font-weight:700;opacity:.95}
.sky .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.sky .when{font-size:.95rem;line-height:1.3;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:999px;padding:8px 14px;align-self:flex-start}
.sky .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:.8rem;font-weight:700;border-radius:999px;padding:4px 10px;background:rgba(255,255,255,.22)}
.tag.fibao{background:var(--fibao);color:#fff}
.sky .edit{flex:0 0 auto;background:rgba(255,255,255,.26);border-radius:999px;padding:8px 16px;font-weight:700;font-size:.92rem;min-height:40px}

.section{margin-top:26px}
.section > h3{margin-bottom:10px}
.card{background:var(--surface);border-radius:var(--radius);padding:16px;border:1px solid var(--line)}

/* tira de próximos días */
.strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:16px;padding:2px 2px 8px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.daypill{flex:0 0 58px;scroll-snap-align:start;border-radius:16px;background:var(--surface);border:1px solid var(--line);padding:8px 4px 10px;text-align:center}
.daypill .wd{font-size:.75rem;color:var(--ink-3)}
.daypill .dn{font-family:var(--display);font-weight:700;font-size:1.2rem}
.daypill .cd{margin:6px auto 0;min-width:40px;width:max-content;padding:3px 7px;border-radius:8px;font-weight:700;font-size:.85rem;color:#fff}
.daypill.today{border-color:var(--ink);border-width:2px}
.daypill.fest .dn{color:var(--fest)}
.daypill.fbday{box-shadow:inset 0 0 0 3px var(--fibao);border-color:var(--fibao)}
.daypill.today.fbday{box-shadow:inset 0 0 0 3px var(--fibao),0 0 0 2px var(--ink)}

.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.fact .k{font-size:.82rem;color:var(--ink-3)}
.fact .v{font-family:var(--display);font-weight:700;font-size:1.15rem;margin-top:2px}
.fact .s{font-size:.85rem;color:var(--ink-2)}

/* progreso del año */
.meter{height:12px;border-radius:999px;background:var(--line);margin:12px 0 8px;position:relative}
.meter b{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--m),var(--t) 55%,var(--n))}
.meter u{position:absolute;top:-6px;bottom:-6px;width:4px;margin-left:-2px;border-radius:2px;background:var(--surface);box-shadow:0 0 0 1.5px var(--ink);text-decoration:none}

/* calendario */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head h2{font-size:1.6rem}
.seg{display:inline-flex;background:var(--line);border-radius:999px;padding:3px}
.seg button{padding:7px 14px;border-radius:999px;font-weight:700;font-size:.88rem;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wdh{font-size:.75rem;text-align:center;color:var(--ink-3);padding-bottom:4px}
.cell{position:relative;aspect-ratio:.78;border-radius:12px;background:var(--surface);border:1px solid var(--line);padding:5px 3px 4px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;overflow:hidden}
.cell.out{visibility:hidden}
.cell .n{font-size:.82rem;font-weight:700;color:var(--ink-2)}
.cell.fest .n{color:var(--fest)}
.cell.today{border:2px solid var(--ink);background:var(--today)}
.cell .c{width:100%;border-radius:7px;color:#fff;font-weight:700;font-size:.78rem;text-align:center;padding:4px 0;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:clip}
.cell .c.empty{background:transparent;color:var(--ink-3)}
.cell.tripday{background:var(--trip);border-color:var(--trip-b)}
.cell.today.tripday{border-color:var(--ink)}
.daypill.tripday{background:var(--trip);border-color:var(--trip-b)}
.leg-trip{background:var(--trip)!important;border:1px solid var(--trip-b)}
.tripdot{display:inline-block;width:12px;height:12px;border-radius:4px;background:var(--trip);border:1px solid var(--trip-b);margin-right:6px;vertical-align:-1px}
.trip-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;margin:14px 0 4px;border-radius:14px;background:var(--trip);border:1px solid var(--trip-b)}
.trip-row small{display:block;color:var(--ink-2);font-size:.8rem;margin-top:2px}
.trip-row .btn{min-height:38px;padding:0 12px;font-size:.88rem;white-space:normal}
.cell.fbday{border-color:var(--fibao);box-shadow:inset 0 0 0 2px var(--fibao)}
.cell.today.fbday{box-shadow:inset 0 0 0 2px var(--fibao),0 0 0 2px var(--ink)}
.cell .badges{position:absolute;right:3px;top:2px;display:flex;gap:2px;align-items:center}
.cell .star{font-size:.7rem;color:var(--fest)}
.pendmark{display:inline-grid;place-items:center;min-width:16px;height:14px;padding:0 3px;border-radius:5px;background:var(--d);color:#fff;font-size:.62rem;font-weight:700;line-height:1}
.daypill{position:relative}
.daypill .pendmark{position:absolute;top:5px;right:5px}
.cell.pendday .c,.daypill.pendday .cd{position:relative}
.cell.pendday .c::after,.daypill.pendday .cd::after{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(135deg,rgba(255,255,255,.45) 0 3px,transparent 3px 7px)}
.tag.pend{background:var(--d);color:#fff}
.ed-group{margin:20px 0 4px}
.switch.pd:checked{background:var(--d)}
.money{display:flex;align-items:center;gap:10px}
.money input{width:110px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);font-size:1rem;text-align:right}
.money-card{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.money-card .k{font-size:.82rem;color:var(--ink-3)}
.money-card .v{font-family:var(--display);font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums}
.resolve{font-weight:700;font-size:.85rem;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.cell .was{font-size:.66rem;line-height:1;min-height:.66rem;color:var(--ink-3);text-decoration:line-through;font-weight:700}
.leg-pend{background:repeating-linear-gradient(135deg,var(--d) 0 3px,color-mix(in srgb,var(--d) 35%,transparent) 3px 6px)!important}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);color:var(--ink-2)}
.tot b{font-family:var(--display);font-size:1.25rem;color:var(--ink)}
.title-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:12px;color:var(--ink)}
.title-btn:active{background:var(--line)}
.mp-year{display:flex;align-items:center;justify-content:space-between;margin:12px 0}
.mp-year b{font-family:var(--display);font-size:1.6rem}
.mp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mp-grid button{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.mp-grid button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mp-grid button.now{box-shadow:inset 0 0 0 2px var(--ink)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 6px 0 12px;margin-bottom:16px;color:var(--ink-3)}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:13px 0;font-size:1rem;color:var(--ink);outline:none}
.search:focus-within{border-color:var(--v);box-shadow:0 0 0 3px color-mix(in srgb,var(--v) 25%,transparent)}
.search .icon-btn{width:36px;height:36px}
.search input::-webkit-calendar-picker-indicator{display:none!important}
.quick{display:flex;align-items:center;gap:10px;margin-top:8px}
.quick button{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:.9rem}
.quick button{display:inline-flex;align-items:center;gap:6px}
.ic-casa{flex:0 0 auto;color:#D6336C;vertical-align:-3px;margin-right:6px}
.quick .ic-casa{margin-right:0}
.quick small{font-size:.78rem;color:var(--ink-3);line-height:1.3}
.saldo.casa .who small{display:block;font-weight:400;font-size:.78rem;color:var(--ink-3)}
.desg{display:grid;margin-top:6px}
.dr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.dr small{display:block;font-size:.78rem;color:var(--ink-3)}
.dr b{font-family:var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.dr.tot2{border-bottom:0;padding-top:10px}
.dr.tot2 span{font-weight:700}
.ed-head{position:sticky;top:-10px;z-index:3;background:var(--surface);margin:-10px -18px 0;padding:10px 18px 12px;border-bottom:1px solid var(--line)}
.cal-notes{margin-top:18px}
.cal-notes h3{margin-bottom:8px}
.cn{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:start;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line)}
.cn:last-child{border-bottom:0}
.cn .d{font-family:var(--display);font-weight:700;line-height:1.1}
.cn .d small{display:block;font-family:var(--body);font-weight:400;font-size:.75rem;color:var(--ink-3)}
.cn .t{color:var(--ink);line-height:1.35}
.cn .t .star{color:var(--fest);margin-right:4px}
.h3row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.h3row h3{margin:0}
.wa{display:block;margin:0;padding:0 0 12px 72px;border-bottom:1px solid var(--line);font-size:.88rem;font-weight:700;color:var(--wa);text-decoration:underline;text-underline-offset:3px}
.wa:last-child{border-bottom:0}
.chg:has(+ .wa){border-bottom:0;padding-bottom:6px}
.card.debe{display:block;width:100%;text-align:left;padding:4px 16px}
.pat-prev .pp.work .pill{outline:2px solid var(--fest);outline-offset:1px}
.mode-help{display:block;margin-top:6px;font-size:.82rem;color:var(--ink-3)}
.pat-seq{display:flex;flex-wrap:wrap;gap:6px;min-height:36px;align-items:center;padding:8px;border:1px dashed var(--line);border-radius:12px}
.pat-arrows{display:inline-flex;gap:4px;flex:0 0 auto}
.pat-arrows .icon-btn{border:1px solid var(--line);font-size:1.3rem}
.pat-seq .pill,.pat-prev .pill{color:#fff}
.pat-prev{display:flex;flex-wrap:wrap;gap:6px}
.pat-prev .pp{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:38px}
.pat-prev .pp i{font-style:normal;font-size:.72rem;color:var(--ink-3)}
.btn[disabled]{opacity:.4}
.swbox{margin-top:10px;padding:12px;border-radius:12px;background:var(--bg);display:grid;gap:8px}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.swrow select{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:110px}
.mini{border:1px solid var(--line);border-radius:14px;padding:8px;background:var(--bg)}
.mini-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.mini-head .icon-btn{width:40px;height:40px;font-size:1.4rem}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.mini-wd{font-size:.7rem;text-align:center;color:var(--ink-3)}
.mini-d{display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 1px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.mini-d i{font-style:normal;font-size:.7rem;font-weight:700;color:var(--ink-2)}
.mini-d.fest i{color:var(--fest)}
.mini-d b{display:block;width:100%;border-radius:5px;color:#fff;font-size:.62rem;line-height:1.5;text-align:center;white-space:nowrap;overflow:hidden;background:var(--line)}
.mini-d.pendday b{position:relative}
.mini-d.pendday b::after{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(135deg,rgba(255,255,255,.45) 0 3px,transparent 3px 6px)}
.mini-d.sel{border:2px solid var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.mini-d.self{opacity:.45;border-style:dashed}
.cell.paintable:active{transform:scale(.94)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:14px;font-size:.82rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.brush{margin-top:14px}
.brushbar{position:sticky;bottom:calc(var(--safe-b) + 78px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px;margin-top:12px;box-shadow:0 10px 30px -12px rgba(0,0,0,.25)}
.brushbar .row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.brushbar p{margin:0 0 8px;font-size:.88rem;color:var(--ink-2)}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:700;background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.wide{width:100%}
.btn.danger{background:transparent;color:var(--fest);border:1px solid var(--line)}
.code-btn{min-width:56px;min-height:48px;border-radius:12px;font-weight:700;font-size:1rem;color:#fff;padding:0 10px;position:relative}
.code-btn[aria-pressed="false"]{background:var(--surface)!important;color:color-mix(in srgb,var(--cc) 55%,var(--ink));box-shadow:inset 0 0 0 2px var(--cc)}
.code-btn .ord{position:absolute;top:-6px;right:-6px;background:var(--ink);color:var(--bg);font-size:.7rem;width:20px;height:20px;border-radius:50%;display:grid;place-items:center}

/* hoja inferior */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:520px;margin:0 auto;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 18px calc(var(--safe-b) + 18px);transform:translateY(105%);visibility:hidden;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s .26s;max-height:92dvh;overflow-y:auto}
.sheet.on{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:1.35rem}
.codes{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.row-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;border-top:1px solid var(--line)}
.row-toggle label{flex:1}
.row-toggle small{display:block;color:var(--ink-3)}
.switch{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch:checked{background:var(--t)}
.switch:checked::after{transform:translateX(20px)}
.switch.fb:checked{background:var(--fibao)}
.field{display:block;margin-top:12px}
.field span{display:block;font-size:.85rem;color:var(--ink-2);margin-bottom:5px}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);font-size:1rem}
.preview{font-family:var(--display);font-weight:800;font-size:1.25rem}
.actions{display:flex;gap:10px;margin-top:16px}
.actions .btn{flex:1}

/* resumen */
.yearbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.big{font-family:var(--display);font-weight:800;font-size:3rem;line-height:1;letter-spacing:-.03em}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 10px 10px;border-top:4px solid var(--c,var(--line))}
.stat .v{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1}
.stat .k{font-size:.8rem;color:var(--ink-2);margin-top:4px}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--body);fill:var(--ink-3);font-size:11px}
.chart .lbl{fill:var(--ink-2);font-weight:700}
.yrs{display:grid;gap:14px}
.yr{display:grid;grid-template-columns:44px 1fr auto;column-gap:10px;row-gap:3px;align-items:center}
.yl{font-weight:700;color:var(--ink-2)}
.yb{height:16px;border-radius:5px;background:var(--line);overflow:hidden}
.yb i{display:block;height:100%;border-radius:5px;background:var(--ink-3)}
.yh{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.ym{grid-column:2 / 4;font-size:.82rem;color:var(--ink-3)}
.yr.sel .yl,.yr.sel .yh{color:var(--ink)}
.yr.sel .yb i{background:var(--ink)}
.tys{display:grid;gap:18px}
.ty-h{font-family:var(--display);font-weight:700;color:var(--ink-2);margin-bottom:6px}
.ty.sel .ty-h{color:var(--ink)}
.ty-r{display:grid;grid-template-columns:136px 1fr 34px;align-items:center;gap:8px;margin-top:4px}
.ty-l{font-size:.82rem;color:var(--ink-2);white-space:nowrap}
.ty-b{height:12px;border-radius:4px;background:var(--line);overflow:hidden}
.ty-b i{display:block;height:100%;border-radius:4px}
.ty-v{text-align:right;font-weight:700;font-size:.88rem;font-variant-numeric:tabular-nums}
.ty:not(.sel) .ty-b i{opacity:.75}
.keyline{display:flex;gap:14px;font-size:.82rem;color:var(--ink-2);margin-top:8px}
.keyline i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* cambios */
.saldo{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.saldo:last-child{border-bottom:0}
.saldo .who{font-weight:700}
.saldo .h{font-family:var(--display);font-weight:800;font-size:1.2rem}
.pos{color:var(--t)} .neg{color:var(--fest)}
.chg{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.chg .dt{font-family:var(--display);font-weight:700;line-height:1.1}
.chg .dt small{display:block;font-family:var(--body);font-weight:400;color:var(--ink-3);font-size:.78rem}
.pills{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pill{border-radius:8px;padding:3px 8px;font-weight:700;font-size:.85rem;color:#fff}
.chg .who{font-size:.85rem;color:var(--ink-2);margin-top:3px}
.chg-txt{display:grid;gap:5px;min-width:0}
.chg .sw-line{font-size:.85rem;color:var(--ink-2)}
.chg .golink{text-decoration:underline;text-underline-offset:3px;font-weight:700;color:var(--ink)}
.chg .golink::after{content:" \203A"}
.nowrap{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chg.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%,30%{background:color-mix(in srgb,var(--d) 28%,transparent)}100%{background:transparent}}
.chg .price{text-align:right;font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.chg .price small{display:block;font-family:var(--body);font-weight:400;font-size:.75rem;color:var(--ink-3)}
.chg .sw-line{display:grid;gap:5px;justify-items:start}
.seg.wide{display:flex;width:100%}
.seg.wide button{flex:1}
.chg .frase{font-size:.88rem;color:var(--ink);font-style:italic}
.chg .who.add{font-style:normal;font-weight:700;color:var(--v);text-decoration:underline;text-underline-offset:3px}
.field input.ask{border-color:var(--v);box-shadow:0 0 0 3px color-mix(in srgb,var(--v) 30%,transparent)}
.chg .who.none{color:var(--ink-3);font-style:italic}

/* ajustes */
.list .field{margin-top:14px}
.codes-table{width:100%;border-collapse:collapse;font-size:.92rem}
.codes-table td{padding:8px 4px;border-bottom:1px solid var(--line)}

/* barra de pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(var(--safe-b) + 6px)}
.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:.74rem;color:var(--ink-3);min-height:52px}
.tabs button svg{width:26px;height:26px}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"] svg{stroke-width:2.4}

/* acceso */
.gate{min-height:80dvh;display:flex;flex-direction:column;justify-content:center;gap:16px}
.gate .sky{min-height:220px}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 88px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:.9rem;opacity:0;transition:.2s;z-index:60;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty-note{padding:18px;border:1px dashed var(--line);border-radius:var(--radius);color:var(--ink-2);text-align:center}
</style>
</head>
<body>
<noscript><div style="max-width:520px;margin:40px auto;padding:20px;font-family:system-ui,sans-serif;line-height:1.5">
  <h1 style="font-size:1.4rem">Turnos necesita JavaScript</h1>
  <p>Esta app funciona con JavaScript y ahora está desactivado en el navegador. En el iPhone: Ajustes › Apps › Safari › Avanzado › JavaScript (en versiones anteriores, Ajustes › Safari › Avanzado). También puedes abrirla con Chrome.</p>
</div></noscript>
<div class="app" id="app">

  <!-- Acceso (primera vez) -->
  <section class="screen" id="s-gate" aria-label="Acceso">
    <div class="gate">
      <div class="sky" style="--sky:linear-gradient(160deg,#FFC98B 0%,#49A9C2 55%,#2B2370 100%);--orb:radial-gradient(circle at 40% 40%,#FFF4D6,#FFC46B);--glow:rgba(255,200,120,.55)">
        <div class="orb"></div>
        <div><div class="date">Hola</div><div class="shift">Turnos</div><div class="hours">Tu cuadrante, tus horas y tus cambios en un sitio.</div></div>
      </div>
      <label class="field"><span>Clave de acceso</span><input id="gate-key" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Pega aquí la clave que te ha enviado Jose"></label>
      <label class="field" id="gate-url-wrap" hidden><span>Dirección del servidor</span><input id="gate-url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec"></label>
      <button class="btn wide" id="gate-go">Entrar</button>
      <button class="btn ghost wide" id="gate-demo">Ver con datos de ejemplo</button>
      <p class="muted" id="gate-msg" role="status"></p>
    </div>
  </section>

  <!-- Hoy -->
  <section class="screen" id="s-hoy" aria-label="Hoy">
    <div class="top">
      <div class="greet" id="greet">Hola</div>
      <div style="display:flex;align-items:center;gap:4px">
        <span class="sync" id="sync"><i></i><span>Al día</span></span>
        <button class="icon-btn" id="open-ajustes" aria-label="Ajustes"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      </div>
    </div>
    <div id="hoy-sky"></div>
    <div class="section"><h3>Próximos días</h3><div class="strip" id="strip"></div></div>
    <div class="section" id="hoy-debe"></div>
    <div class="section"><div class="facts" id="facts"></div></div>
    <div class="section" id="hoy-year"></div>
    <div class="section" id="hoy-imp"></div>
  </section>

  <!-- Calendario -->
  <section class="screen" id="s-cal" aria-label="Calendario">
    <div class="cal-head">
      <button class="icon-btn" id="cal-prev" aria-label="Mes anterior"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button type="button" class="title-btn" id="cal-pick" aria-label="Elegir mes y año"><h2 id="cal-title">Mes</h2><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      <button class="icon-btn" id="cal-next" aria-label="Mes siguiente"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px">
      <div class="seg" role="group" aria-label="Qué calendario ver">
        <button id="lay-real" aria-pressed="true">Real</button>
        <button id="lay-orig" aria-pressed="false">Cuadrante</button>
      </div>
      <span style="display:inline-flex;gap:6px"><button type="button" class="btn ghost" id="cal-find" aria-label="Buscar en las notas" style="min-height:40px;padding:0 12px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button><button class="btn ghost" id="brush-toggle" aria-pressed="false" style="min-height:40px;padding:0 14px">Editar</button></span>
    </div>
    <div class="grid7" id="cal-wd"></div>
    <div class="grid7" id="cal-grid"></div>
    <div class="brushbar" id="brushbar" hidden>
      <p id="brush-msg">Elige un turno y toca los días a los que se lo quieres poner.</p>
      <div class="row" id="brush-codes"></div>
      <button type="button" class="btn ghost wide" id="brush-pat" style="margin-top:10px;min-height:44px" hidden>Rellenar con un patrón…</button>
    </div>
    <div class="legend" id="legend"></div>
    <div id="cal-notes"></div>
  </section>

  <!-- Resumen -->
  <section class="screen" id="s-res" aria-label="Resumen">
    <div class="yearbar">
      <button class="icon-btn" id="res-prev" aria-label="Año anterior"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2 id="res-title">Año</h2>
      <button class="icon-btn" id="res-next" aria-label="Año siguiente"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div id="res-body"></div>
  </section>

  <!-- Cambios -->
  <section class="screen" id="s-cam" aria-label="Cambios">
    <div class="yearbar">
      <button class="icon-btn" id="cam-prev" aria-label="Año anterior"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2 id="cam-title">Cambios</h2>
      <button class="icon-btn" id="cam-next" aria-label="Año siguiente"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="cam-q" type="text" inputmode="search" enterkeyhint="search" list="cam-names" placeholder="Buscar cambios con una compañera" autocomplete="off" aria-label="Filtrar por compañera"><button type="button" class="icon-btn" id="cam-q-clear" aria-label="Borrar búsqueda" hidden>✕</button><datalist id="cam-names"></datalist></div>
    <div id="cam-body"></div>
  </section>

  <!-- Ajustes -->
  <section class="screen" id="s-aj" aria-label="Ajustes">
    <div class="top"><h2>Ajustes</h2><button class="icon-btn" id="close-ajustes" aria-label="Volver"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div id="aj-body"></div>
  </section>
</div>

<nav class="tabs" id="tabs" role="tablist" hidden>
  <div class="in">
    <button role="tab" data-s="hoy" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Hoy</button>
    <button role="tab" data-s="cal" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendario</button>
    <button role="tab" data-s="res" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Resumen</button>
    <button role="tab" data-s="cam" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 7h12l-3-3M17 17H5l3 3"/></svg>Cambios</button>
  </div>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="ed-title"></div>
<div class="toast" id="toast" role="status"></div>

<script src="config.js" charset="utf-8"></script>
<script src="app.js" charset="utf-8"></script>
</body>
</html>
